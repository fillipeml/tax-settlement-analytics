[project]
name = "pgfn-settlement-pipeline"
version = "0.1.0"
description = "Crawl, extract and consolidate the individual tax-settlement terms published by Brazil's federal treasury attorney (PGFN)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7",
  "anthropic>=1.0",
]

[project.scripts]
pgfn-crawl = "pgfn_pipeline.crawler:main"
pgfn-extract = "pgfn_pipeline.extract:main"
pgfn-extract-batch = "pgfn_pipeline.extract_batch:main"
pgfn-build = "pgfn_pipeline.build_dataset:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfn_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
