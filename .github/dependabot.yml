version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: monthly
    groups:
      pipeline:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
